<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажёры английского</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
<style>

[hidden]{display:none!important}
html,body{margin:0}
#launcher{--bg:#f4f1ec;--card:#fff;--ink:#1d2433;--mut:#5f6878;--line:#ddd7cc;--acc:#2f5bea;min-height:100dvh;background:var(--bg);color:var(--ink);font:500 17px/1.5 "Manrope",system-ui,sans-serif;padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));box-sizing:border-box}
@media (prefers-color-scheme:dark){#launcher{--bg:#12161f;--card:#1b2130;--ink:#e9edf7;--mut:#9aa5bb;--line:#2b3447;--acc:#7c9bff}}
#launcher .lw{max-width:560px;margin:0 auto}
#launcher h1{font-size:30px;line-height:1.15;margin:12px 0 6px}
#launcher .lsub{color:var(--mut);margin:0 0 22px}
#launcher .lh{font-size:20px;margin:26px 0 12px}
#launcher .srow{display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:10px;cursor:pointer}
#launcher .srow small{display:block;color:var(--mut);font-size:14px;line-height:1.35;margin-top:2px}
#launcher .srow input{flex:none;width:24px;height:24px;accent-color:var(--acc)}
#launcher .pick{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;color:inherit;font:inherit;cursor:pointer}
#launcher .pick:hover,#launcher .pick:focus-visible{border-color:var(--acc);outline:none}
#launcher .pick .e{font-size:32px;line-height:1}
#launcher .pick b{display:block;font-size:21px;margin:8px 0 4px}
#launcher .pick small{display:block;color:var(--mut);font-size:15px;line-height:1.45}
#t1{--bg:#eef2f9;--card:#fff;--ink:#14213d;--mut:#5d6a85;--line:#d5dcea;--acc:#2f5bea;--accbg:#e3eaff;--ok:#16825a;--okbg:#d9f3e8;--bad:#c93a54;--badbg:#fbe1e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){#t1{--bg:#0e1526;--card:#172038;--ink:#e8edf9;--mut:#93a0bf;--line:#2a3554;--acc:#7c9bff;--accbg:#22305a;--ok:#4fd39a;--okbg:#143a2e;--bad:#ff7b93;--badbg:#45202b}}
#t1{scroll-padding-top:env(safe-area-inset-top,0px)}
#t1 *{box-sizing:border-box}
#t1{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.5 "Manrope",system-ui,sans-serif}
#t1 main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
#t1 h1{font-size:26px;margin:4px 0}
#t1 .sub{color:var(--mut);margin:0 0 14px;font-size:15px}
#t1 button,#t1 input{font-family:system-ui,sans-serif}
#t1 button:focus-visible,#t1 input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#t1 .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
#t1 .top{display:flex;gap:14px;align-items:center}
#t1 .pic{font-size:52px;line-height:1;background:var(--accbg);border-radius:12px;padding:10px 12px}
#t1 .w{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#t1 .en{font-size:26px;font-weight:700}
#t1 .ru{color:var(--acc);font:600 17px system-ui,sans-serif}
#t1 .def,#t1 .ex{margin:8px 0 0}
#t1 .ex{font-style:italic}
#t1 .tr{font:15px system-ui,sans-serif;color:var(--mut);font-style:normal}
#t1 .col{margin:8px 0 0;padding-left:18px;font:15px system-ui,sans-serif}
#t1 .as{margin-top:10px;display:grid;gap:6px;font:15px system-ui,sans-serif}
#t1 .tag{display:inline-block;background:var(--accbg);color:var(--acc);font-weight:700;border-radius:6px;padding:1px 8px;margin-right:4px;font-size:13px}
#t1 .spk{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:2px 8px;cursor:pointer;font-size:15px}
#t1 .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font:14px system-ui,sans-serif;color:var(--mut);margin-bottom:8px}
#t1 .lnk{background:none;border:0;color:var(--acc);cursor:pointer;font:600 14px system-ui,sans-serif;padding:0}
#t1 .prog{height:6px;background:var(--line);border-radius:3px;margin-bottom:14px;overflow:hidden}
#t1 .prog i{display:block;height:100%;background:var(--acc)}
#t1 .q{font-size:30px;font-weight:700;margin:6px 0 4px}
#t1 .qs{font-size:20px;margin:6px 0 4px}
#t1 .hint{color:var(--mut);font:14px system-ui,sans-serif;margin:4px 0 12px}
#t1 .opts{display:grid;gap:8px}
#t1 .opt,#t1 .btn{font:700 16px "Manrope",system-ui,sans-serif;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:left}
#t1 .btn{background:var(--acc);color:#fff;border-color:var(--acc);text-align:center}
#t1 .btn.sec{background:var(--card);color:var(--ink);border-color:var(--line)}
#t1 .btn:disabled{opacity:.4;cursor:not-allowed}
@media (hover:hover){#t1 .opt:hover:not(:disabled){border-color:var(--acc)}}
#t1 .opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
#t1 .opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
#t1 .slots{display:flex;gap:6px;flex-wrap:wrap;min-height:48px;margin:8px 0 12px}
#t1 .slot{width:36px;height:44px;border-bottom:3px solid var(--line);font:700 24px system-ui,sans-serif;text-align:center}
#t1 .letters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
#t1 .letters button{width:44px;height:48px;font:700 22px system-ui,sans-serif;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
#t1 .letters button:disabled{opacity:.25}
#t1 input[type=text]{width:100%;font:600 20px system-ui,sans-serif;padding:12px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:10px}
#t1 .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#t1 .fb{margin-top:14px;padding:12px 14px;border-radius:8px;font:15px/1.5 system-ui,sans-serif}
#t1 .fb.ok{background:var(--okbg);color:var(--ok)}
#t1 .fb.bad{background:var(--badbg);color:var(--bad)}
#t1 .fb em{color:var(--ink)}
#t1 .mrow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;font-family:system-ui,sans-serif}
#t1 .mrow input{width:22px;height:22px;margin-top:2px;accent-color:var(--acc)}
#t1 .mrow small{color:var(--mut)}
#t1 .ml{margin:8px 0 16px}
#t1 .hid{background:var(--line);color:transparent;border-radius:4px;cursor:pointer;padding:0 6px;user-select:none}
#t1 .hid.sh{background:var(--accbg);color:var(--acc);font-weight:700}
#t1 .seg{display:flex;gap:6px;margin-bottom:12px}
#t1 .seg button{flex:1;font:600 15px system-ui,sans-serif;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
#t1 .seg .on{background:var(--acc);color:#fff;border-color:var(--acc)}
#t1 .slot.wd{width:auto;min-width:36px;padding:0 8px;font-size:20px}
#t1 .letters.wd button{width:auto;padding:0 12px;font-size:17px}
#t1 .big{font-size:44px;font-weight:700;margin:4px 0}
#t1{min-height:100dvh}
#t2{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef2f9;--card:#fff;--ink:#14213d;--mute:#5d6a85;--line:#d5dcea;--acc:#2f5bea;--acc-t:#e3eaff;--ok:#16825a;--ok-t:#d9f3e8;--bad:#c93a54;--bad-t:#fbe1e6}
@media (prefers-color-scheme:dark){#t2{--bg:#0e1526;--card:#172038;--ink:#e8edf9;--mute:#93a0bf;--line:#2a3554;--acc:#7c9bff;--acc-t:#22305a;--ok:#4fd39a;--ok-t:#143a2e;--bad:#ff7b93;--bad-t:#45202b}}
#t2[data-theme="dark"]{--bg:#0e1526;--card:#172038;--ink:#e8edf9;--mute:#93a0bf;--line:#2a3554;--acc:#7c9bff;--acc-t:#22305a;--ok:#4fd39a;--ok-t:#143a2e;--bad:#ff7b93;--bad-t:#45202b}
#t2 *{box-sizing:border-box}
#t2,#t2{height:100%;margin:0}
#t2{background:var(--bg);color:var(--ink);font:500 17px/1.45 "Manrope",system-ui,sans-serif;display:flex;justify-content:center;overscroll-behavior:none}
#t2 #app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;padding:14px 16px 12px}
#t2 .top{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--mute)}
#t2 .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
#t2 .bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
#t2 .stage{flex:1;position:relative;margin:14px 0 10px;touch-action:none;overflow:hidden;min-height:0}
#t2 .card{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;overflow:auto;transition:transform .25s ease,opacity .25s ease;user-select:none;touch-action:none}
#t2 .card.out{transform:translateY(-110%);opacity:0}
#t2 .tag{align-self:flex-start;font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--acc-t);color:var(--acc)}
#t2 .tag.p{background:var(--line);color:var(--mute)}
#t2 .item{font-size:34px;font-weight:800;line-height:1.1}
#t2 .tr{color:var(--mute);margin-top:-8px}
#t2 .scene{border-left:4px solid var(--acc);padding:2px 0 2px 14px;font-size:18px}
#t2 .scene b{color:var(--mute);font-weight:700;margin-right:6px}
#t2 .ex{margin:0;padding-left:20px}
#t2 .tip{background:var(--acc-t);border-radius:12px;padding:10px 12px;font-size:15px}
#t2 .q{font-size:20px;font-weight:700}
#t2 .opts{display:grid;gap:9px}
#t2 button{font:inherit;font-weight:700;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left;cursor:pointer}
@media (hover:hover){#t2 button:hover:not(:disabled){border-color:var(--acc)}}
#t2 button{-webkit-tap-highlight-color:transparent}
#t2 .mic.big{width:100%;height:64px}
#t2 .mic.big svg{width:30px;height:30px}
#t2 .mic,#t2 .mic *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#t2 .mic{touch-action:none}
#t2 .mic svg{pointer-events:none}
#t2 .ans.top{margin-top:2px}
#t2.kb .top,#t2.kb .foot{display:none}
#t2.kb .card>*:not(.prompt):not(.dock):not(.fb):not(.trow){display:none}
#t2.kb .stage{margin:8px 0}
#t2 .heard{font-size:24px;font-weight:800;min-height:34px}
#t2 .heard .ok{color:var(--ok)}
#t2 .heard .bad{color:var(--bad)}
#t2 button:focus-visible,#t2 input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#t2 button.ok{background:var(--ok-t);border-color:var(--ok)}
#t2 button.bad{background:var(--bad-t);border-color:var(--bad)}
#t2 button.sel{border-color:var(--acc);background:var(--acc-t)}
#t2 button.main{background:var(--acc);border-color:var(--acc);color:#fff;text-align:center}
#t2 button:disabled{cursor:default}
#t2 .ans,#t2 .pool{display:flex;flex-wrap:wrap;gap:8px}
#t2 .ans{min-height:56px;border-bottom:2px solid var(--line);padding-bottom:10px;align-content:flex-start}
#t2 .chip{padding:8px 12px;border-radius:12px;text-align:center}
#t2 .cols{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px}
#t2 .cols button{padding:10px 12px;font-size:15px}
#t2 input.txt{font:inherit;font-weight:700;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px 14px;width:100%;user-select:text}
#t2 .row{display:flex;gap:8px;align-items:stretch}
#t2 .row input.txt{flex:1;min-width:0}
#t2 .mic{flex:none;width:54px;padding:0;display:grid;place-items:center;color:var(--acc)}
#t2 .mic svg{width:24px;height:24px}
#t2 .mic.on{background:var(--bad-t);border-color:var(--bad);color:var(--bad);animation:pulse 1.1s infinite}
#t2 .mic:disabled{opacity:.45}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--bad-t)}}
#t2 .hint{font-size:14px;color:var(--mute);min-height:20px}
@media (prefers-reduced-motion:reduce){#t2 .mic.on{animation:none}}
#t2 .fb{border-radius:14px;padding:12px 14px;font-size:16px}
#t2 .fb.ok{background:var(--ok-t);color:var(--ok)}
#t2 .fb.bad{background:var(--bad-t);color:var(--bad)}
#t2 .fb span{display:block;color:var(--ink);font-weight:500;margin-top:4px}
#t2 .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--mute)}
#t2 .foot button{padding:9px 14px;border-radius:99px;text-align:center;font-size:14px}
#t2 .foot div{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#t2 pre.json{position:absolute;inset:0;margin:0;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--ink);z-index:2;user-select:text;white-space:pre-wrap}
#t2 .end{align-items:flex-start;justify-content:center}
#t2 .end h2{font-size:30px;margin:0}
#t2 .stat{display:flex;gap:10px;flex-wrap:wrap}
#t2 .stat div{flex:1;min-width:90px;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
#t2 .stat b{display:block;font-size:26px}
#t2 .units{width:100%;display:grid;gap:6px;font-size:15px}
#t2 .units div{display:flex;justify-content:space-between}
@media (prefers-reduced-motion:reduce){#t2 .card,#t2 .bar i{transition:none}}
#t2 .backb{flex:none;border:0!important;background:none!important;color:var(--acc)!important;padding:4px 6px!important;font-size:14px;border-radius:8px}
#t2{height:100dvh}
#t2 .dock{margin:auto -20px -22px;padding:12px 20px 22px;position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;z-index:1}
#t2 .q.prompt{margin-top:2px}
#t2 .hrow{display:flex;gap:8px;flex-wrap:wrap}
#t2 .hcol{display:flex;flex-direction:column;gap:8px}
#t2 button.hintb{display:grid;width:100%;text-align:left;padding:9px 14px;font-size:14px;border-radius:12px;color:var(--mute)}
#t2 .hintb>span{grid-area:1/1}
#t2 .hintb .r{visibility:hidden}
#t2 .hintb.sh{color:var(--ink)}
#t2 .hintb.sh .l{visibility:hidden}
#t2 .hintb.sh .r{visibility:visible}
#t2 .trow{display:flex;justify-content:space-between;align-items:center}
#t2 button.repb{padding:6px 12px;border-radius:99px;font-size:18px;line-height:1;text-align:center}
#t2 .fb .nx{font-size:13px;opacity:.7;margin-top:6px}
#t2 .hint.sh{color:var(--ink);font-weight:700}
#t2 .chip.l{min-width:42px;padding:9px 10px;font-size:20px}
#t2 #kbp{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;pointer-events:none}
</style>
</head>
<body>
<section id="launcher"><div class="lw">
<h1>Тренажёры английского</h1>
<p class="lsub">Выберите, как сегодня заниматься.</p>
<button class="pick" id="pick1"><span class="e">📖</span><b>Тренажёр слов</b><small>Слова, выражения и сочетания. Обучение парами или повторение, разные режимы: перевод, сборка из букв, вписывание, пропуски, произнесение вслух.</small></button>
<button class="pick" id="pick2"><span class="e">⚡</span><b>Лента карточек</b><small>Короткие карточки по фразовым глаголам в формате ленты. Свайп вверх пропускает карточку, есть голосовой ввод и звук при верном ответе.</small></button>
<h2 class="lh">Настройки</h2>
<label class="srow"><span><b>Озвучка слов</b><small>Произносить слово, когда появляется карточка</small></span><input type="checkbox" id="cv"></label>
<label class="srow"><span><b>Звуки ответов</b><small>Мягкий сигнал за верный и неверный ответ</small></span><input type="checkbox" id="cs"></label>
<label class="srow"><span><b>Ручной переход</b><small>После ответа свайп вверх открывает следующую карточку</small></span><input type="radio" name="nm" value="manual"></label>
<label class="srow"><span><b>Автопереход</b><small>Через 2 секунды после ответа карточка листается сама</small></span><input type="radio" name="nm" value="auto"></label>
<label class="srow"><span><b>Данные карточки</b><small>Служебный JSON поверх карточки, для отладки</small></span><input type="checkbox" id="cd"></label>
</div></section>
<div id="t1" hidden><main><button class="lnk" id="back1">← Выбор тренажёра</button><h1>Тренажёр слов</h1><div id="t1app"></div></main></div>
<div id="t2" hidden><div id="app">
  <div class="top"><button class="backb" id="back2" aria-label="К выбору тренажёра">← Меню</button><span id="cnt"></span><div class="bar"><i id="prog"></i></div><span id="score"></span></div>
  <div class="stage" id="stage"></div><input id="kbp" aria-hidden="true" tabindex="-1" autocomplete="off" autocapitalize="off">
  
</div></div>
<script>(function(){

const WORDS=[
{em:"🏆",en:"achieve",ru:"достигать",def:"to succeed in doing something good, usually after hard work",defru:"добиться чего-то хорошего, обычно после тяжёлой работы",ex:"She worked hard to [achieve] her goal.",exru:"Она много работала, чтобы [достичь] своей цели.",col:[["achieve a goal","достичь цели"],["achieve success","добиться успеха"],["achieve results","получить результаты"]],as:[["Созвучие","«ачивка» в играх — награда за достижение"],["Образ","альпинист с флагом на вершине"],["Синоним","reach, succeed"]]},
{em:"🚧",en:"avoid",ru:"избегать",def:"to stay away from something or not let it happen",defru:"держаться подальше от чего-то или не допустить этого",ex:"I try to [avoid] sugar in the evening.",exru:"Я стараюсь [избегать] сахара вечером.",col:[["avoid problems","избегать проблем"],["avoid mistakes","избегать ошибок"],["avoid traffic","объехать пробки"]],as:[["Созвучие","«эвойд» — «обойду» стороной"],["Образ","человек обходит большую лужу"],["Антоним","face — столкнуться лицом к лицу"]]},
{em:"📈",en:"improve",ru:"улучшать",def:"to make something better",defru:"сделать что-то лучше",ex:"I want to [improve] my English this year.",exru:"Я хочу [улучшить] свой английский в этом году.",col:[["improve your skills","улучшить навыки"],["improve your health","улучшить здоровье"],["improve quickly","быстро улучшаться"]],as:[["Созвучие","«импрув» — «в прок»: всё идёт на пользу"],["Образ","график, который идёт вверх"],["Синоним / антоним","get better / get worse"]]},

  return function(res){var kp=document.getElementById('kbp');if(kp&&document.activeElement===inp)try{kp.focus({preventScroll:true})}catch(e){}inp.disabled=true;mic.disabled=true;b.style.visibility='hidden';hint.textContent='';inp.style.borderColor=res.ok?'var(--ok)':'var(--bad)'};
 },
 check:function(a,s){var n=norm(a);
  if(s.accept.some(function(x){return norm(x)===n}))return {ok:true,score:1};
  if(n.length>3&&s.accept.some(function(x){return lev(n,norm(x))<=1}))return {ok:true,score:.8,note:'Почти: в слове опечатка.'};
  return {ok:false,score:0}},
 show:function(s){return s.accept[0]}
};
TASKS.match={
 render:function(t,box,submit){
  box.appendChild(el('div','q',t.payload.prompt));
  var pairs=t.payload.pairs,map={},sel=null,n=0,cols=el('div','cols'),L=[],R=[];
  var left=pairs.map(function(p){return p[0]}),right=shuffle(pairs.map(function(p){return p[1]}));
  var lc=el('div','opts'),rc=el('div','opts');cols.appendChild(lc);cols.appendChild(rc);
  left.forEach(function(v){var b=el('button','',v);b.onclick=function(){if(b.disabled)return;if(sel)sel.className='';sel=b;b.className='sel'};lc.appendChild(b);L.push(b)});
  right.forEach(function(v){var b=el('button','',v);b.onclick=function(){if(b.disabled||!sel)return;
    map[sel.textContent]=v;sel.disabled=b.disabled=true;sel.className=b.className='sel';sel=null;
    if(++n===left.length)submit(map)};rc.appendChild(b);R.push(b)});
  box.appendChild(cols);
  return function(res,t){var truth={};pairs.forEach(function(p){truth[p[0]]=p[1]});
   L.forEach(function(b){var good=map[b.textContent]===truth[b.textContent];b.className=good?'ok':'bad';
     R.forEach(function(r){if(r.textContent===map[b.textContent])r.className=good?'ok':'bad'})})};
 },
 check:function(a,s,t){var c=0;t.payload.pairs.forEach(function(p){if(a[p[0]]===p[1])c++});var sc=c/t.payload.pairs.length;
  return {ok:sc===1,score:sc,note:sc<1?'Верно '+c+' из '+t.payload.pairs.length:''}},
 show:function(s,t){return t.payload.pairs.map(function(p){return p.join(' = ')}).join('; ')}
};
TASKS.ack={
 render:function(t,box){box.appendChild(el('div','hint','Прочитайте и свайпните вверх, чтобы продолжить'))},
 check:function(){return {ok:true,score:1}},show:function(){return ''}};
function cleanS(x){return String(x).toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim()}
function said(h,a){h=cleanS(h);a=cleanS(a);if((' '+h+' ').indexOf(' '+a+' ')>=0)return true;var f=function(x){return x.replace(/[' ]/g,'')};return /[' ]/.test(a)&&f(a).length>0&&f(h).indexOf(f(a))>=0}
function paint(box,txt,aw,all){box.innerHTML='';cleanS(txt).split(' ').forEach(function(w){if(w)box.appendChild(el('span',all||aw.indexOf(w)>=0?'ok':'bad',w+' '))})}
TASKS.speak={
 render:function(t,box,submit){
  box.appendChild(el('div','q',t.payload.prompt));
  var ans=t.answer_spec.accept[0],aw=cleanS(ans).split(' '),tries=0,heard=el('div','heard'),hint=el('div','hint'),val='';
  var o={get value(){return val},set value(v){val=v;heard.textContent=v}};
  var mic=micButton(o,hint,'en-US');mic.classList.add('big');mic.setAttribute('aria-label','Нажмите и скажите');
  var fin=false;mic.onpartial=function(v){if(!fin&&said(v,ans)){fin=true;mic.stop(function(){submit(val)})}};
  mic.onfinal=function(){if(fin||!val)return;tries++;
   if(said(val,ans)||tries>=2){submit(val);return}
   paint(heard,val,aw);hint.textContent='Не то слово. Удерживайте микрофон и попробуйте ещё раз (попытка 2 из 2).'};
  hintBtns(box,t.payload.hints);box.appendChild(heard);box.appendChild(mic);box.appendChild(hint);
  hint.textContent='Удерживайте микрофон и говорите.';
  return function(res){mic.disabled=true;hint.textContent='';paint(heard,val,aw,res.ok)};
 },
 check:function(a,s){var ok=said(a,s.accept[0]);return {ok:ok,score:ok?1:0}},
 show:function(s){return s.accept[0]}};
TASKS.self_check={
 render:function(t,box,submit){
  box.appendChild(el('div','q',t.payload.prompt));var o=el('div','opts');
  hintBtns(box,t.payload.reveal?[['Показать ответ',t.payload.reveal]]:null);var y=el('button','','Сказал(а), получилось'),n=el('button','','Не получилось, повторю позже');
  y.onclick=function(){submit('yes',y)};n.onclick=function(){submit('no',n)};o.appendChild(y);o.appendChild(n);box.appendChild(o);
  return function(res,t,chosen){y.disabled=n.disabled=true;chosen.className=res.ok?'ok':'bad'};
 },
 check:function(a){return {ok:a==='yes',score:a==='yes'?1:0}},
 show:function(){return ''}
};

/* ===== Звуки ответа (один общий AudioContext, разблокируется первым касанием) ===== */
var actx=null;
function ac(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}return actx}
['pointerdown','keydown','touchend'].forEach(function(n){document.addEventListener(n,ac,true)});
function tone(list,vol,type){
  if(!CFG.sound)return;var C=ac();if(!C)return;var t=C.currentTime;
  list.forEach(function(n){var o=C.createOscillator(),g=C.createGain(),s=t+n[1];
    o.type=type||'sine';o.frequency.value=n[0];o.connect(g);g.connect(C.destination);
    g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(vol,s+0.03);g.gain.exponentialRampToValueAtTime(0.0001,s+0.35);
    o.start(s);o.stop(s+0.4)});
}
function chime(){tone([[659.25,0],[783.99,.09],[1046.5,.18]],.2)}
function buzz(){tone([[330,0],[262,.14]],.07,'triangle')}

/* ============ ДВИЖОК ленты ============ */
var stage=document.getElementById('stage');
var queue,i,ti,st,wrong,answered,AT=0,ansAt=0;
var UNITS0=UNITS,CUR={cards:CARDS};
function reset(){queue=CUR.cards.map(function(c){return Object.assign({},c)});i=0;st={ok:0,bad:0,skip:0,prog:{}};for(var u in UNITS)st.prog[u]=0;draw()}
function tts(t,l){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang=l;u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
var lastSay=null;
function sayTask(t){var c=queue[i],x=t.say||(c&&c.kind==='lesson'&&UNITS[c.units[0].id]&&{t:UNITS[c.units[0].id].title,l:'en-US'});lastSay=x||null;var rb=document.getElementById('rep');if(rb)rb.hidden=!lastSay;if(CFG.voice&&x)tts(x.t,x.l)}
var kbp=document.getElementById('kbp');
function warmKb(){var c=queue[i],nx=(c&&ti<c.tasks.length-1)?c.tasks[ti+1]:(queue[i+1]&&queue[i+1].tasks[0]);if(nx&&nx.type==='type_word'){try{kbp.focus({preventScroll:true})}catch(e){}}}
function head(){
  document.getElementById('cnt').textContent=Math.min(i+1,queue.length)+' / '+queue.length;
  document.getElementById('prog').style.width=(i/queue.length*100)+'%';
  document.getElementById('score').textContent='Верно: '+st.ok;
}
function draw(){
  head();stage.innerHTML='';
  if(i>=queue.length){
    var e=el('div','card end');e.appendChild(el('h2','','Готово на сегодня'));
    var s=el('div','stat');
    [['Верно',st.ok],['Ошибки',st.bad],['Пропуски',st.skip]].forEach(function(p){var d=el('div');d.appendChild(el('b','',p[1]));d.appendChild(el('span','',p[0]));s.appendChild(d)});
    e.appendChild(s);e.appendChild(el('div','','Сила знания по единицам:'));
    var us=el('div','units');
    for(var u in UNITS){var r=el('div');r.appendChild(el('span','',UNITS[u].title));var v=st.prog[u];r.appendChild(el('span','',new Array(v+1).join('●')+new Array(4-v).join('○')));us.appendChild(r)}
    e.appendChild(us);
    var b=el('button','main','Пройти заново');b.onclick=reset;e.appendChild(b);stage.appendChild(e);return;
  }
  ti=0;wrong=false;answered=false;
  var c=queue[i],card=el('div','card');card.id='card';
  var tr=el('div','trow');tr.appendChild(el('span','tag'+(c.kind==='practice'?' p':''),c.kind==='lesson'?'Новое':'Тренировка'));var rpb=el('button','repb','🔊');rpb.id='rep';rpb.type='button';rpb.hidden=true;rpb.setAttribute('aria-label','Повторить озвучку');rpb.onclick=function(){if(lastSay)tts(lastSay.t,lastSay.l)};tr.appendChild(rpb);card.appendChild(tr);
  c.units.filter(function(x){return x.role==='teaches'}).forEach(function(x){
    card.appendChild(el('div','item',UNITS[x.id].title));card.appendChild(el('div','tr',UNITS[x.id].data.tr))});
  c.blocks.forEach(function(b){card.appendChild(BLOCKS[b.type](b.payload))});
  var box=el('div');box.id='task';box.className='dock';card.appendChild(box);
  stage.appendChild(card);drawJson();showTask();
}
function drawJson(){var o=document.getElementById('json');if(o)o.remove();
  if(CFG.data&&queue[i]){var p=el('pre','json',JSON.stringify(queue[i],null,1));p.id='json';stage.appendChild(p)}}
function showTask(){
  var c=queue[i],t=c.tasks[ti],box=document.getElementById('task');box.innerHTML='';answered=false;
  [].forEach.call(box.parentNode.querySelectorAll('.q.prompt,.ans.top,.fb'),function(x){x.remove()});
  var mark=TASKS[t.type].render(t,box,function(a,extra){
    if(answered)return;answered=true;
    if(t.type==='ack'){warmKb();if(ti>=c.tasks.length-1)advance('done');else{ti++;showTask()}return}
    var res=TASKS[t.type].check(a,t.answer_spec||{},t);
    if(mark)mark(res,t,extra);finish(res,t);
  });
  ['.q','.ans'].forEach(function(sl){var x=box.querySelector(sl);if(x){x.classList.add(sl==='.q'?'prompt':'top');box.parentNode.insertBefore(x,box)}});
  if(t.type!=='type_word'){document.getElementById('t2').classList.remove('kb');if(document.activeElement===kbp)kbp.blur()}
  sayTask(t);
}
function finish(res,t){
  var c=queue[i],box=document.getElementById('task'),T=TASKS[t.type],fb=t.feedback||{};
  if(res.ok){st.ok++;chime()}else{st.bad++;wrong=true;buzz()}
  c.units.forEach(function(x){var v=st.prog[x.id];st.prog[x.id]=Math.max(0,Math.min(3,v+(res.ok?1:-1)))});
  var msg=res.ok?(fb.right||'Верно'):(t.type==='self_check'?'Вернёмся к этому позже':(res.score>0?'':'')+'Правильный ответ: '+T.show(t.answer_spec||{},t));
  var f=el('div','fb '+(res.ok?'ok':'bad'),msg);
  var extra=[res.note,!res.ok&&fb.wrong].filter(Boolean).join(' ');if(extra)f.appendChild(el('span','',extra));
  if(!CFG.auto)f.appendChild(el('div','nx','Свайп вверх — дальше'));
  box.parentNode.insertBefore(f,box);ansAt=Date.now();head();
  if(CFG.auto)AT=setTimeout(skip,2000);
}
function advance(kind){
  var c=queue[i],card=document.getElementById('card');if(!card)return;
  if(kind==='skip')st.skip++;
  if((kind==='skip'||wrong)&&!c.rq)queue.splice(Math.min(i+4,queue.length),0,Object.assign({},c,{rq:true}));
  clearTimeout(AT);stopMic();card.classList.add('out');var j=document.getElementById('json');if(j)j.remove();
  setTimeout(function(){i++;draw()},220);
}
function skip(){if(i>=queue.length)return;var c=queue[i],t=c.tasks[ti];clearTimeout(AT);warmKb();
  if(answered&&ti<c.tasks.length-1){ti++;showTask();return}
  advance(answered||t.type==='ack'?'done':'skip')}

/* свайп вверх = пропуск (работает, даже если жест начат на кнопке) */
var sy=null,s0=0,ov=0,moved=false;
function curCard(){return document.getElementById('card')}
stage.addEventListener('pointerdown',function(e){
  if(e.target.closest('input,pre,.mic')||(e.pointerType==='mouse'&&e.button!==0))return;
  var c=curCard();if(!c)return;sy=e.clientY;s0=c.scrollTop;ov=0;moved=false});
window.addEventListener('pointermove',function(e){
  if(sy===null)return;var c=curCard();if(!c)return;var d=e.clientY-sy;
  if(Math.abs(d)>10)moved=true;if(!moved)return;
  var max=c.scrollHeight-c.clientHeight,want=Math.max(0,s0-d);
  ov=want>max?want-max:0;c.scrollTop=Math.min(want,max);
  c.style.transition='none';c.style.transform='translateY('+(-ov)+'px)'});
function endSwipe(){
  if(sy===null)return;var c=curCard();sy=null;
  if(moved){var h=function(ev){ev.stopPropagation();ev.preventDefault()};window.addEventListener('click',h,true);setTimeout(function(){window.removeEventListener('click',h,true)},80)}
  if(!c)return;c.style.transition='';
  if(ov>80)skip();else c.style.transform=''}
window.addEventListener('pointerup',endSwipe);
window.addEventListener('pointercancel',endSwipe);
window.chimePreview=function(){chime()};
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&answered&&Date.now()-ansAt>400&&!document.getElementById('t2').hidden){e.preventDefault();skip()}});
if(window.visualViewport){var T2=document.getElementById('t2'),vv=window.visualViewport;function fit(){if(T2.hidden)return;var q=T2.style;q.position='fixed';q.left='0';q.right='0';q.top=vv.offsetTop+'px';q.height=vv.height+'px';if(window.scrollY)window.scrollTo(0,0)}vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit);document.addEventListener('focusin',function(){fit();setTimeout(fit,60);setTimeout(fit,350)});window.addEventListener('scroll',fit)}
(function(){var T=document.getElementById('t2');function tx(x){return x&&(x.id==='kbp'||(x.classList&&x.classList.contains('txt')))}
document.addEventListener('focusin',function(e){if(tx(e.target)){T.classList.add('kb');document.documentElement.style.background=getComputedStyle(T).backgroundColor}});
document.addEventListener('focusout',function(){setTimeout(function(){if(!tx(document.activeElement))T.classList.remove('kb')},150)})})()
document.addEventListener('keydown',function(e){if(e.key==='ArrowUp'&&!document.getElementById('t2').hidden&&document.activeElement.tagName!=='INPUT')skip()});
window.t2={start:function(o){if(o){CUR=o;UNITS=o.units}else{CUR={cards:CARDS};UNITS=UNITS0}reset();var c=queue[0];if(c&&c.tasks[0].type==='type_word')try{kbp.focus({preventScroll:true})}catch(e){}},stop:function(){clearTimeout(AT);stopMic();try{speechSynthesis.cancel()}catch(e){}}};
reset();
})();</script>
<script>(function(){
var L=document.getElementById('launcher'),A=document.getElementById('t1'),B=document.getElementById('t2'),back='l';
function show(w){L.hidden=w!=='l';A.hidden=w!=='1';B.hidden=w!=='2';if(w!=='2'){B.style.cssText='';B.classList.remove('kb');document.documentElement.style.background=''}window.scrollTo(0,0)}
function home(){try{t2.stop()}catch(e){}try{speechSynthesis.cancel()}catch(e){}show('l')}
window.feedStart=function(o){back='1';show('2');t2.start(o)};
document.getElementById('pick1').onclick=function(){show('1');t1.start()};
document.getElementById('pick2').onclick=function(){back='l';show('2');t2.start()};
var C=window.CFG;
[['cv','voice'],['cs','sound'],['cd','data']].forEach(function(p){var e=document.getElementById(p[0]);e.checked=!!C[p[1]];e.onchange=function(){C[p[1]]=e.checked;cfgSave();if(p[1]==='voice'&&!e.checked)try{speechSynthesis.cancel()}catch(x){}if(p[1]==='sound'&&e.checked)chimePreview()}});
[].forEach.call(document.querySelectorAll('input[name=nm]'),function(r){r.checked=(r.value==='auto')===!!C.auto;r.onchange=function(){C.auto=r.value==='auto';cfgSave()}});
document.getElementById('back1').onclick=home;
